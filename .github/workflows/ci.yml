name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Secret scan
        run: |
          ! grep -RInE "AIzaSy[A-Za-z0-9_-]{20,}|SQUBg|Nodnod|gateway01|sk_live_|pdl_live_" . \
            --exclude-dir=.git --exclude-dir=scratch --exclude-dir=_dev_scripts --exclude=.env || exit 1

      - name: Compile
        run: python -m compileall app.py db_setup.py migrate_db.py payment_webhook_app.py worker.py utils ui workflow engine pdf_engine

      - name: Tests
        run: pytest
