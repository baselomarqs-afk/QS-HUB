[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["scratch", "_dev_scripts", "__pycache__", ".qto_cache", ".gemini_cache", ".pytest_cache", "tests/.pytest_cache", "node_modules", "frontend", "dist", "tmp"]
addopts = "-q --basetemp=tmp/pytest -p no:cacheprovider"
